[package]
name = "relswap"
version = "0.0.5"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Signed-release install/update engine with durable activation and crash recovery"
repository = "https://github.com/tui-lipan/relswap"
readme = "README.md"
keywords = ["updater", "release", "install", "ed25519"]
categories = ["command-line-utilities", "filesystem"]
exclude = ["tests/fixtures/**"]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ed25519-dalek = "3"
flate2 = "1"
fs4 = "1.1"
getrandom = "0.4"
hex = "0.4"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
ureq = { version = "3.3", default-features = false, features = ["rustls"] }
url = "2"
zip = { version = "5.1", default-features = false, features = ["deflate-flate2"] }

[features]
default = []
release-tool = []

[[bin]]
name = "relswap"
path = "src/bin/relswap.rs"
required-features = ["release-tool"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_IO",
  "Win32_System_Memory",
  "Win32_System_Threading",
] }
